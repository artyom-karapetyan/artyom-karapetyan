name: Generate Git Koi

# 1. Tells GitHub WHEN to run
on:
  schedule:
    - cron: "0 0 * * *"   # Run automatically every night
  workflow_dispatch:      # Or when you manually click "Run"

# 2. Gives GitHub permission to save files to your repo
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest # 3. Spins up the temporary cloud machine
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Downloads your repo files onto that machine

      # -------------------------------------------------------------
      # ⭐ THIS IS THE EXACT 2-LINE SNIPPET FROM THE MARKETPLACE:
      - name: git-profile-koi
        uses: yalongwastaken/git-koi@v1.0.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      # -------------------------------------------------------------

      # 4. Saves the generated koi picture back into your repo
      - name: Commit and push generated asset
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update git-koi asset" && git push)
